[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kulture-sync"
version = "0.1.0"
description = "Taskmaster Agent: Background Music Curation and Data-Safe Caching for South African Users"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=2.0.0",
    "google-cloud-firestore>=2.11.0",
    "google-genai>=0.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]
